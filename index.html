<!doctype html>
<html lang="lt">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex,nofollow">
	<title>Video Lab — WordPress peržiūra</title>
	<style>
		html, body { height: 100%; margin: 0; background: #fff; color: #000; font-family: system-ui, sans-serif; }
		iframe { display: block; width: 100%; height: 100%; border: 0; }
		.fallback { max-width: 40rem; margin: 4rem auto; padding: 0 1.25rem; line-height: 1.5; }
		a { color: #000; }
	</style>
</head>
<body>
	<iframe
		title="Video Lab WordPress Playground"
		src="https://playground.wordpress.net/?mode=browser-full-screen&amp;blueprint-url=https://mcjessco.github.io/VL-preview/blueprint.json?v=0.2.0"
		allow="clipboard-read; clipboard-write; fullscreen"
		referrerpolicy="no-referrer-when-downgrade"
	></iframe>
	<noscript>
		<div class="fallback">
			<p>Ši peržiūra paleidžia tikrą WordPress naršyklėje.</p>
			<p><a href="https://playground.wordpress.net/?blueprint-url=https://mcjessco.github.io/VL-preview/blueprint.json?v=0.2.0">Atidaryti WordPress peržiūrą</a></p>
		</div>
	</noscript>
</body>
</html>
